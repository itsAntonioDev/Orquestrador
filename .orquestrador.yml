# Pipeline de CI do próprio orquestrador (dogfooding).
# Rodar localmente: orquestrador run .orquestrador.yml
name: orquestrador-ci

# Usada pelo executor docker; o executor local ignora.
image: python:3.11-slim

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    timeout: 600
    steps:
      - name: instalar dependências
        run: python -m pip install -q -e ".[dev]"
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .

  test:
    needs: lint
    timeout: 1200
    steps:
      - name: instalar dependências
        run: python -m pip install -q -e ".[dev]"
      - name: pytest
        run: python -m pytest -q
