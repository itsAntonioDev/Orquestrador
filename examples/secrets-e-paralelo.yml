# Steps paralelos e secrets.
# Local:   orquestrador run examples/secrets-e-paralelo.yml -s DEPLOY_TOKEN=tok-exemplo
# Servidor: orquestrador secrets set DEPLOY_TOKEN --project meu-projeto
name: paralelo-e-secrets

jobs:
  qualidade:
    steps:
      - name: preparar
        shell: python
        run: print("instalando dependências...")

      # Os três steps rodam ao mesmo tempo, no mesmo workspace.
      - name: verificacoes
        fail-fast: true          # se um falhar, os outros são cancelados
        max-parallel: 3          # opcional: limita a concorrência
        parallel:
          - name: lint
            shell: python
            run: import time; time.sleep(1); print("lint ok")
          - name: testes unitários
            shell: python
            run: import time; time.sleep(1); print("unit ok")
          - name: checagem de tipos
            shell: python
            run: import time; time.sleep(1); print("types ok")

  deploy:
    needs: qualidade
    env:
      # Só secrets referenciados explicitamente chegam ao step.
      TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: publicar
        shell: python
        run: |
          import os
          print("usando o token", os.environ["TOKEN"])   # aparece como *** no log
          print("tamanho do token:", len(os.environ["TOKEN"]))
