# Parallel steps and secrets.
# Local:   orquestrador run examples/secrets-e-paralelo.yml -s DEPLOY_TOKEN=tok-exemplo
# Server:  orquestrador secrets set DEPLOY_TOKEN --project meu-projeto
# name: paralelo-e-secrets

jobs:
  qualidade:
    steps:
      - name: preparar
        shell: python
        run: print("instalando dependências...")

      # All three steps run at the same time, in the same workspace.
      - name: verificacoes
        fail-fast: true          # If one fails, the others are canceled.
        max-parallel: 3          # optional: limits concurrency
        parallel:
          - name: lint
            shell: python
            run: import time; time.sleep(1); print("lint ok")
          - name: testes unitários
            shell: python
            run: import time; time.sleep(1); print("unit ok")
          - name: checagem de tipos
            shell: python
            run: import time; time.sleep(1); print("types ok")

  deploy:
    needs: qualidade
    env:
      # Only explicitly referenced secrets are passed to the step.
      TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: publicar
        shell: python
        run: |
          import os
          print("usando o token", os.environ["TOKEN"])   # aparece como *** no log
          print("tamanho do token:", len(os.environ["TOKEN"]))
