[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orquestrador"
version = "0.1.0"
description = "Orquestrador de CI/CD self-hosted com pipelines em YAML, inspirado em GitHub Actions e Jenkins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orquestrador contributors" }]
keywords = ["ci", "cd", "pipeline", "devops", "docker", "webhooks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "docker>=7.1",
    "redis>=5.0",
    "rq>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "fakeredis>=2.23",
]

[project.scripts]
orquestrador = "orquestrador.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orquestrador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: requer um daemon Docker acessível (pulado automaticamente se indisponível)",
    "postgres: requer ORQ_TEST_POSTGRES_URL apontando para um PostgreSQL de testes",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/orquestrador/db/alembic/versions/*" = ["E501"]
"tests/*" = ["E501", "RUF012"]